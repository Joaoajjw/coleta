<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin • Poder da Imaginação</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #f0ece4;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .login-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-overlay.hidden { display: none; }
        .login-box {
            background: #14141e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 40px;
            max-width: 380px;
            width: 100%;
        }
        .login-box h2 { font-size: 24px; margin-bottom: 8px; color: #c9b084; }
        .login-box p { color: #a8a0b8; font-size: 14px; margin-bottom: 24px; }
        .login-box input {
            width: 100%; padding: 12px 16px;
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px; color: #f0ece4; font-size: 14px; margin-bottom: 16px;
        }
        .login-box input:focus { outline: none; border-color: #c9b084; }
        .login-box button {
            width: 100%; padding: 12px;
            background: #c9b084; border: none;
            border-radius: 8px; color: #0a0a0f;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .login-box button:hover { background: #d4c0a0; }
        .login-box .error-msg { color: #f87171; font-size: 12px; margin-top: 12px; display: none; }
        .login-box .error-msg.visible { display: block; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }
        .header .logo { font-size: 20px; color: #c9b084; font-weight: 300; }
        .header .badge {
            font-size: 12px; color: #6a6a82;
            background: #1a1a2e; padding: 4px 12px; border-radius: 20px;
        }
        .header .logout {
            background: none; border: 1px solid rgba(255,255,255,0.06);
            padding: 6px 16px; border-radius: 20px;
            color: #a8a0b8; cursor: pointer; font-size: 12px;
        }
        .header .logout:hover { background: #1a1a2e; }

        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px; margin-bottom: 24px;
        }
        .stat-card {
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; padding: 16px; text-align: center;
        }
        .stat-card .number { font-size: 24px; font-weight: 600; color: #f0ece4; }
        .stat-card .label { font-size: 11px; color: #6a6a82; margin-top: 4px; text-transform: uppercase; }

        .section-title { font-size: 14px; color: #a8a0b8; margin-bottom: 12px; }
        .coleta-item {
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
        }
        .coleta-item .row {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 8px;
        }
        .coleta-item .id { font-size: 11px; color: #6a6a82; font-family: monospace; }
        .coleta-item .timestamp { font-size: 12px; color: #6a6a82; }
        .coleta-item .local { font-size: 12px; color: #a8a0b8; }
        .coleta-item .has-foto { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.15); }
        .coleta-item .no-foto { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.15); }
        .coleta-item .toggle {
            background: none; border: none; color: #6a6a82;
            cursor: pointer; font-size: 11px; padding: 4px 8px;
        }
        .coleta-item .toggle:hover { color: #a8a0b8; }
        .coleta-item .details {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 12px; display: none;
        }
        .coleta-item .details.visible { display: block; }
        .coleta-item .details .row {
            display: flex; justify-content: space-between; padding: 4px 0; font-size: 11px;
        }
        .coleta-item .details .row .label { color: #6a6a82; }
        .coleta-item .details .row .value { color: #a8a0b8; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .loading-state, .empty-state { text-align: center; padding: 40px 0; color: #6a6a82; font-size: 14px; }
        .empty-state .icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }

        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .stats { grid-template-columns: 1fr 1fr; }
            .coleta-item .row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>✦ Acesso Restrito</h2>
            <p>Digite a senha para acessar o painel.</p>
            <input type="password" id="senhaInput" placeholder="Senha..." autofocus>
            <button id="loginBtn">Entrar</button>
            <div class="error-msg" id="loginError">Senha incorreta. Tente novamente.</div>
        </div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
        <div class="header">
            <div class="logo">✦ Poder da Imaginação</div>
            <div style="display:flex;align-items:center;gap:12px;">
                <span class="badge" id="totalColetas">0 coletas</span>
                <button class="logout" id="logoutBtn">Sair</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="number" id="statTotal">0</div><div class="label">Total</div></div>
            <div class="stat-card"><div class="number" id="statComFoto">0</div><div class="label">Com Foto</div></div>
            <div class="stat-card"><div class="number" id="statComLocal">0</div><div class="label">Com Local</div></div>
            <div class="stat-card"><div class="number" id="statHoje">0</div><div class="label">Hoje</div></div>
        </div>

        <div class="section-title">📋 Histórico de Coletas <span class="badge" id="countLabel">carregando...</span></div>
        <div class="coletas-list" id="coletasList">
            <div class="loading-state">⏳ Carregando dados...</div>
        </div>
    </div>

    <script>
        (function() {
            const SENHA_ADMIN = 'imaginacao2026';

            const loginOverlay = document.getElementById('loginOverlay');
            const senhaInput = document.getElementById('senhaInput');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const mainContent = document.getElementById('mainContent');
            const logoutBtn = document.getElementById('logoutBtn');
            const coletasList = document.getElementById('coletasList');
            const totalColetas = document.getElementById('totalColetas');
            const statTotal = document.getElementById('statTotal');
            const statComFoto = document.getElementById('statComFoto');
            const statComLocal = document.getElementById('statComLocal');
            const statHoje = document.getElementById('statHoje');
            const countLabel = document.getElementById('countLabel');

            function fazerLogin() {
                if (senhaInput.value === SENHA_ADMIN) {
                    loginOverlay.classList.add('hidden');
                    mainContent.style.display = 'block';
                    loginError.classList.remove('visible');
                    carregarDados();
                } else {
                    loginError.classList.add('visible');
                    senhaInput.value = '';
                    senhaInput.focus();
                }
            }

            function fazerLogout() {
                mainContent.style.display = 'none';
                loginOverlay.classList.remove('hidden');
                senhaInput.value = '';
                loginError.classList.remove('visible');
                senhaInput.focus();
            }

            async function carregarDados() {
                coletasList.innerHTML = '<div class="loading-state">⏳ Carregando dados...</div>';

                try {
                    console.log('📊 Buscando dados em:', '/api/admin');
                    const response = await fetch('/api/admin');
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const data = await response.json();
                    console.log('📊 Dados recebidos:', data);

                    if (!data.arquivos || data.arquivos.length === 0) {
                        coletasList.innerHTML = `
                            <div class="empty-state">
                                <div class="icon">🌿</div>
                                <div>Nenhuma coleta registrada ainda.</div>
                                <div style="font-size:12px;margin-top:4px;">Acesse o site principal para começar.</div>
                            </div>
                        `;
                        countLabel.textContent = '0 coletas';
                        atualizarStats([]);
                        return;
                    }

                    renderizarColetas(data.arquivos);
                    atualizarStats(data.arquivos);

                } catch (error) {
                    console.error('❌ Erro ao carregar:', error);
                    coletasList.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">⚠️</div>
                            <div>Erro ao carregar dados.</div>
                            <div style="font-size:12px;margin-top:4px;">${error.message}</div>
                            <div style="font-size:11px;margin-top:8px;color:#4a4a62;">Tente recarregar a página.</div>
                        </div>
                    `;
                }
            }

            function renderizarColetas(arquivos) {
                countLabel.textContent = arquivos.length + ' coletas';

                let html = '';
                arquivos.forEach((item, index) => {
                    const dados = item.conteudo || {};
                    const local = dados.localizacao || {};
                    const navegador = dados.navegador || {};
                    const temFoto = !!dados.foto;
                    const temLocal = !!(local.latitude && local.longitude);

                    html += `
                        <div class="coleta-item" data-index="${index}">
                            <div class="row">
                                <div>
                                    <span class="id">#${dados.id ? dados.id.substring(0,8) : '—'}</span>
                                    <span class="timestamp">${formatarData(dados.timestamp)}</span>
                                </div>
                                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                                    ${temFoto ? '<span class="has-foto">📸 Foto</span>' : '<span class="no-foto">📸 Sem foto</span>'}
                                    ${temLocal ? `<span class="local">📍 ${local.latitude.toFixed(4)}, ${local.longitude.toFixed(4)}</span>` : ''}
                                    <button class="toggle" data-index="${index}">▾ Detalhes</button>
                                </div>
                            </div>
                            <div class="details" id="details-${index}">
                                <div class="row"><span class="label">ID</span><span class="value">${dados.id || '—'}</span></div>
                                <div class="row"><span class="label">Data/Hora</span><span class="value">${formatarDataCompleta(dados.timestamp)}</span></div>
                                ${local.latitude ? `<div class="row"><span class="label">Latitude</span><span class="value">${local.latitude}</span></div>` : ''}
                                ${local.longitude ? `<div class="row"><span class="label">Longitude</span><span class="value">${local.longitude}</span></div>` : ''}
                                ${local.precisao ? `<div class="row"><span class="label">Precisão</span><span class="value">${local.precisao}m</span></div>` : ''}
                                <div class="row"><span class="label">Navegador</span><span class="value">${navegador.userAgent ? navegador.userAgent.substring(0,50) + '...' : '—'}</span></div>
                                <div class="row"><span class="label">Timezone</span><span class="value">${navegador.timezone || '—'}</span></div>
                                <div class="row"><span class="label">Idioma</span><span class="value">${navegador.language || '—'}</span></div>
                                ${dados.ip ? `<div class="row"><span class="label">IP</span><span class="value">${dados.ip}</span></div>` : ''}
                                ${dados.foto ? `<div class="row"><span class="label">Foto</span><span class="value" style="font-size:10px;max-width:70%;">${dados.foto.substring(0,50)}...</span></div>` : ''}
                            </div>
                        </div>
                    `;
                });

                coletasList.innerHTML = html;

                document.querySelectorAll('.toggle').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = this.dataset.index;
                        const details = document.getElementById('details-' + idx);
                        details.classList.toggle('visible');
                        this.textContent = details.classList.contains('visible') ? '▴ Ocultar' : '▾ Detalhes';
                    });
                });
            }

            function atualizarStats(arquivos) {
                const total = arquivos.length;
                let comFoto = 0, comLocal = 0, hoje = 0;
                const hojeStr = new Date().toISOString().split('T')[0];

                arquivos.forEach(item => {
                    const dados = item.conteudo || {};
                    if (dados.foto) comFoto++;
                    if (dados.localizacao && dados.localizacao.latitude) comLocal++;
                    if (dados.timestamp && dados.timestamp.startsWith(hojeStr)) hoje++;
                });

                statTotal.textContent = total;
                statComFoto.textContent = comFoto;
                statComLocal.textContent = comLocal;
                statHoje.textContent = hoje;
                totalColetas.textContent = total + ' coletas';
            }

            function formatarData(timestamp) {
                if (!timestamp) return '—';
                const d = new Date(timestamp);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
            }

            function formatarDataCompleta(timestamp) {
                if (!timestamp) return '—';
                const d = new Date(timestamp);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }

            loginBtn.addEventListener('click', fazerLogin);
            senhaInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fazerLogin(); });
            logoutBtn.addEventListener('click', fazerLogout);

            setTimeout(() => senhaInput.focus(), 300);

        })();
    </script>
</body>
</html>
