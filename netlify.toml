[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "frontend"

# ===== ROTAS =====
[[redirects]]
  from = "/api/coletar"
  to = "/.netlify/functions/coletar"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
